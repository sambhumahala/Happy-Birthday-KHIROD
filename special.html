<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Surprise</title>

<style>
:root {
    --primary-color: #6c5ce7;
    --accent-color: #a29bfe;
}

body, html {
    margin: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
}

/* Button */
#reveal-btn {
    padding: 20px 40px;
    font-size: 1.5rem;
    background-color: var(--primary-color);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(108,92,231,0.6);
    transition: 0.3s;
}

#reveal-btn:hover {
    transform: scale(1.1);
    background-color: var(--accent-color);
}

/* Gallery */
#gallery {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: fadeIn 1.5s ease forwards;
}

#gallery h1 {
    margin-bottom: 20px;
}

img {
    width: 300px;
    max-width: 90%;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    border: 3px solid var(--accent-color);
    opacity: 0;
    transition: opacity 1.5s ease;
}

p {
    margin-top: 15px;
    font-style: italic;
}

/* Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<button id="reveal-btn" onclick="startShow()">Click for a Surprise 🎁</button>

<div id="gallery">
    <h1>Happy Birthday, Biscotti..! 🎉</h1>
    <img id="photo" src="" alt="Memory">
    <p id="caption">Every picture tells a story ❤️</p>
</div>

<script>
const photos = [
    "IMG_20260123_131357.png.jpeg",
    "IMG_20260122_233639.jpg.jpeg",
    "IMG_20260123_131254.png.jpeg",
    "IMG_20260123_131314.png.jpeg",
    "IMG_20260123_131337.png.jpeg",
    "IMG_20260123_131413.png (1).jpeg"
];

let index = 0;

function startShow() {
    document.getElementById("reveal-btn").style.display = "none";

    const gallery = document.getElementById("gallery");
    gallery.style.display = "flex";

    showNextPhoto();
}

function showNextPhoto() {
    const img = document.getElementById("photo");
    
    img.style.opacity = 0;

    setTimeout(() => {
        img.src = photos[index];
        img.style.opacity = 1;

        index++;
        if (index < photos.length) {
            setTimeout(showNextPhoto, 2500); // next photo timing
        }
    }, 500);
}
</script>

</body>
</html>
